[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "builder-agent"
version = "0.1.0"
description = "Builder agent (ADSP Topic 4): turns a Python ML repo into a working MLOps pipeline"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "packaging>=23",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["builder_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
