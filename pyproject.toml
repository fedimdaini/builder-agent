[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "builder-agent"
version = "0.1.0"
description = "Builder agent (ADSP Topic 4): turns a Python ML repo into a working MLOps pipeline"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "packaging>=23",
    "jinja2>=3.1",
    "pyflakes>=3",
    "chromadb==1.0.15",      # fix memory (RAG); 0.6.x needs a C++ build of hnswlib on Windows/3.12
    "rank-bm25==0.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["builder_agent*"]

[tool.setuptools.package-data]
"builder_agent.render" = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-rfE"          # name every failure and error in the summary
